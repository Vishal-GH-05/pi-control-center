spring.application.name=pi-control-centre
fast.metrics.collector.interval=2s
sensor.metrics.collector.interval=5s
slow.metrics.collector.interval=30s
db.metrics.collector.updater.interval=10s
spring.data.redis.host=localhost
spring.data.redis.port=6379
glances.base-url=${GLANCES_BASE_URL:http://localhost:61208}
# PostgreSQL datasource
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# Hibernate schema management (development)
spring.jpa.hibernate.ddl-auto=update

# Show SQL during development
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true